<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 268" width="900" height="268" role="img" aria-label="DSH 窗口示意图：顶部一条 24 像素高的横条显示倒计时与两个按钮，下方内容区和输入框完整可见、可继续输入">
  <defs>
    <linearGradient id="strip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCF3E3"/>
      <stop offset="100%" stop-color="#F8E9D2"/>
    </linearGradient>
  </defs>

  <!-- 窗口 -->
  <rect x="8" y="8" width="884" height="252" rx="12" fill="#FFFFFF" stroke="#D8D3CB" stroke-width="1.5"/>

  <!-- 顶部窗口 chrome（标题栏） -->
  <path d="M8 20a12 12 0 0 1 12-12h868a12 12 0 0 1 12 12v26H8z" fill="#F4F1EC"/>
  <circle cx="30" cy="27" r="4.5" fill="#D9D3C9"/>
  <circle cx="46" cy="27" r="4.5" fill="#D9D3C9"/>
  <circle cx="62" cy="27" r="4.5" fill="#D9D3C9"/>
  <text x="86" y="31" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#8C857A">DeepSeek Harness</text>
  <text x="446" y="31" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#8C857A">文件</text>
  <text x="486" y="31" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#8C857A">编辑</text>
  <text x="526" y="31" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#8C857A">视图</text>

  <!-- 横条本体：24px 高，通栏，紧贴 chrome 下方 -->
  <rect x="8" y="46" width="884" height="24" fill="url(#strip)"/>
  <rect x="8" y="69" width="884" height="1.5" fill="#EBDCC2"/>

  <circle cx="32" cy="58" r="4" fill="#C8892E"/>
  <text x="46" y="62.5" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#6B4A15">DSH 将在 28 秒后重启</text>
  <text x="188" y="62.5" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#8A6A38">· 装了插件更新，需要重启才能生效</text>

  <!-- 按钮：立即重启（实心，18px 高） -->
  <rect x="672" y="49" width="84" height="18" rx="4" fill="#C8892E"/>
  <text x="714" y="62" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#FFFFFF">立即重启</text>

  <!-- 按钮：稍后（描边，18px 高） -->
  <rect x="766" y="49" width="58" height="18" rx="4" fill="#FFFFFF" stroke="#D9C092" stroke-width="1"/>
  <text x="795" y="62" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#7A5C28">稍后</text>

  <!-- 内容区：说明横条不遮挡任何东西 -->
  <rect x="28" y="92" width="200" height="9" rx="4.5" fill="#EAE6DF"/>
  <rect x="28" y="112" width="560" height="9" rx="4.5" fill="#EAE6DF"/>
  <rect x="28" y="132" width="520" height="9" rx="4.5" fill="#EAE6DF"/>
  <rect x="28" y="152" width="600" height="9" rx="4.5" fill="#EAE6DF"/>
  <rect x="28" y="172" width="380" height="9" rx="4.5" fill="#EAE6DF"/>

  <!-- 输入框：说明可以继续打字 -->
  <rect x="28" y="196" width="844" height="46" rx="10" fill="#FFFFFF" stroke="#DCD6CC" stroke-width="1.5"/>
  <text x="48" y="224" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#A9A29A">继续打字……</text>
</svg>